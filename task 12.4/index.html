<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Search & Filter</title>
    <style>
        .hidden { display: none; }
        #error { color: red; }
        .controls label, .controls input, .controls select { margin: 6px 8px 6px 0; }
        .user-card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 12px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>User Directory</h1>
    </header>

    <main id="app">
        <section class="controls" aria-label="Search and filters">
            <label for="search">Search</label>
            <input type="search" id="search" placeholder="Name or email">

            <label for="sort">Sort</label>
            <select id="sort">
                <option value="az">Name A-Z</option>
                <option value="za">Name Z-A</option>
            </select>

            <label for="city">City</label>
            <select id="city">
                <option value="">All cities</option>
            </select>
        </section>

        <p id="count" role="status"></p>
        <p id="loading" role="status">Loading...</p>
        <p id="error" class="hidden" role="alert"></p>

        <section id="users-container" aria-label="List of users"></section>
    </main>

    <footer>
        <p>Data from JSONPlaceholder</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
